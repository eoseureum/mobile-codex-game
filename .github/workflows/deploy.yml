
name: Godot Web Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5

    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r \
            /root/.local/share/godot/export_templates/4.5.stable \
            ~/.local/share/godot/export_templates/

          test -f \
            ~/.local/share/godot/export_templates/4.5.stable/web_nothreads_release.zip

      - name: Import resources
        run: |
          godot --headless --path . \
            --editor --quit

      - name: Export game
        run: |
          mkdir -p build/web
          godot --headless --path . \
            --export-release "Web" \
            build/web/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
