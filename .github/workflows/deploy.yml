name: Rust City Godot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      campaign_checks:
        description: Run historical full campaigns (pre-central-market)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.5
    env:
      XDG_DATA_HOME: /root/.local/share
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot container dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1
          test -s "$XDG_DATA_HOME/godot/export_templates/4.5.stable/web_nothreads_release.zip"
      - name: Import resources and validate scripts
        run: godot --headless --path . --editor --quit
      - name: Run factory and save regression tests
        if: github.event_name == 'workflow_dispatch' && inputs.campaign_checks
        run: godot --headless --path . --script tests/test_runner.gd
      - name: Check warehouse-funded city projects and save compatibility
        run: godot --headless --path . --script tests/test_project_stock.gd
      - name: Check central sales, collection, footprint, migration and touch UI
        run: |
          godot --headless --path . --script tests/test_sales_hub.gd
          godot --headless --path . --script tests/test_sales_hub_ui.gd
      - name: Check start menu, independent worlds and legacy migration
        run: |
          godot --headless --path . --script tests/test_world_library.gd
          godot --headless --path . --script tests/test_start_screen.gd
          godot --headless --path . --script tests/test_start_flow.gd
      - name: Check open world, routes, local inventory and clearing
        run: godot --headless --path . --script tests/test_world.gd
      - name: Check empty city opening and paid first factory line
        run: godot --headless --path . --script tests/test_empty_start.gd
      - name: Check opening discovery and atomic connected expansion
        run: godot --headless --path . --script tests/test_opening_ux.gd
      - name: Check production-driven facility animations
        run: |
          godot --headless --path . --script tests/test_motion.gd
          godot --headless --path . --script tests/test_upgrade_accuracy.gd
      - name: Check stable production controls
        run: godot --headless --path . -- --ui-check
      - name: Check floating layout and touch targets
        run: godot --headless --path . --script tests/test_ui_layout.gd
      - name: Check resource scatter, income averaging and compact cards
        run: |
          godot --headless --path . --script tests/test_conveyors.gd
          godot --headless --path . --script tests/test_scatter.gd
          godot --headless --path . --script tests/test_income_meter.gd
          godot --headless --path . --script tests/test_compact_cards.gd
      - name: Check pinch zoom and touch safety
        run: godot --headless --path . --script tests/test_pinch.gd
      - name: Check facility management, conveyor topology and Korean glyphs
        run: |
          godot --headless --path . --script tests/test_opening_prices.gd
          godot --headless --path . --script tests/test_factory_polish.gd
          godot --headless --path . --script tests/test_polish_ui.gd
          godot --headless --path . --script tests/test_conveyor_shapes.gd
          godot --headless --path . --script tests/test_font_glyphs.gd
      - name: Generate and replay historical paid campaign without publishing detailed traces
        if: github.event_name == 'workflow_dispatch' && inputs.campaign_checks
        run: |
          godot --headless --path . --script tools/campaign_balance.gd
          godot --headless --path . --script tools/campaign_balance.gd -- --replay=res://docs/balance/2026-10-22-opening-prices-zero-latency.json
      - name: Export single-threaded web game
        run: |
          mkdir -p build/web
          touch build/.gdignore
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
      - uses: actions/upload-artifact@v4
        with:
          name: rust-city-web
          path: build/web
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed main branch
        id: deployment
        uses: actions/deploy-pages@v4
