name: Godot validation

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot system font dependency
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1
      - name: Set up Web templates
        run: |
          if [ ! -f ~/.local/share/godot/export_templates/4.5.stable/web_nothreads_release.zip ]; then
            mkdir -p ~/.local/share/godot/export_templates/4.5.stable
            cp /root/.local/share/godot/export_templates/4.5.stable/web_nothreads_*.zip \
              ~/.local/share/godot/export_templates/4.5.stable/
          fi
      - name: Import and check resources
        run: |
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' import.log
      - name: Test physics and input
        run: timeout 60s godot --headless --path . --script tests/test_game.gd
      - name: Export single-threaded Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee export.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' export.log
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: build/web
